[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

# Firebase client-side keys are intentionally public — security is enforced
# by Firebase Security Rules, not by keeping these keys secret.
# Vite inlines VITE_FIREBASE_* values into the bundle; Netlify's smart
# secrets scanner then flags the Firebase API key pattern (AIza...).
# We disable smart detection here since this is expected/safe behaviour.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Firebase config comes from Netlify environment variables.
# Set these in: Netlify dashboard → Site → Environment variables
# VITE_FIREBASE_API_KEY
# VITE_FIREBASE_AUTH_DOMAIN
# VITE_FIREBASE_DATABASE_URL
# VITE_FIREBASE_PROJECT_ID
# VITE_FIREBASE_STORAGE_BUCKET
# VITE_FIREBASE_MESSAGING_SENDER_ID
# VITE_FIREBASE_APP_ID
